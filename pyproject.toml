[project]
name = "rra"
version = "0.1.0"
description = "Retinal Age Atlas: regional and bilateral retinal age from fundus photographs."
readme = "README.md"
authors = [{ name = "Krish Jeswal", email = "krishjeswal@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.3",
    "omegaconf>=2.3.1",
    "optuna>=5.0.0",
    "patsy>=1.0.3",
    "polars>=1.44.2",
    "scipy>=1.18.1",
    "segmentation-models-pytorch>=0.5.0",
    "statsmodels>=0.15.0",
    "timm>=1.0.30",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "wandb>=0.30.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "NPY", "PT", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
